<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Local - Application Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 600px;
        }
        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        p {
            color: #666;
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .feature {
            display: inline-block;
            background: #f0f0f0;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 25px;
            color: #667eea;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Event Local</h1>
        <p>Application Mobile pour Événements Locaux</p>
        <p>Découvrez, participez et organisez les événements de votre région</p>
        <div>
            <span class="feature">📍 Localisation GPS</span>
            <span class="feature">🎪 Événements Locaux</span>
            <span class="feature">👥 Communauté</span>
        </div>
        <p style="margin-top: 40px; font-size: 0.9em; color: #999;">
            Site en construction - Revenez bientôt!
        </p>
    </div>
</body>
</html>
